<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0e" />
    <meta name="description" content="Strug — Your Time. Your Work. Your Money. The all-in-one platform for services, commerce, community, and more." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Strug" />
    <meta property="og:description" content="Your Time. Your Work. Your Money." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Strug" />
    <meta name="twitter:description" content="Your Time. Your Work. Your Money." />
    <!-- Set data-theme before first paint so a light-theme user never sees a flash of the
         dark default. Must stay inline/blocking (not in main.jsx) — by the time a module
         script runs, the browser has already painted the first frame. Keep the key in sync
         with STORAGE_KEY in src/utils/theme.js. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('strug_theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/strug.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Strug" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet" />
    <title>Strug</title>
    <!-- Leaflet is bundled via the npm `leaflet` / `react-leaflet` packages inside
         the lazy map-page chunks (CSS imported per-page). The previous render-blocking
         unpkg <script>/<link> here was a redundant second copy loaded on every page. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
